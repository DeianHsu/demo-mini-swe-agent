[project]
name = "mini-swe-agent-demo"
version = "0.1.0"
description = "基于 Docker Bash 和原生函数调用的最小编程智能体示例"
authors = [
    { name = "DeianHsu", email = "663781679@qq.com" }
]
requires-python = ">=3.14"
dependencies = [
    "openai>=3.35.1",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "swe"
